[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-forge"
version = "0.1.0"
description = "A local-first, evidence-preserving AI research loop with deterministic execution gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<50",
  "openai-codex==0.144.4",
  "httpx>=0.27,<1",
  "h5py>=3.10,<4",
  "pydantic>=2.10,<3",
  "pypdf>=5.0,<7",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
api = [
  "openai-agents>=0.18,<1",
]
dev = [
  "matplotlib>=3.9,<4",
  "pillow>=11.0",
  "pytest>=8.3",
]
external-research = [
  "huggingface-hub==1.24.0",
  "mcp>=1.28,<2",
  "openai>=2.45,<3",
  "paper-search-mcp==0.1.4",
]
paper-evidence = [
  "paper-qa==2026.3.18",
]
publication = [
  # Altair is BSD-3-Clause. PyMuPDF is AGPL-3.0-or-later and remains an
  # isolated renderer adapter so deployments may replace it without changing
  # frozen Figure Specs.
  "altair==6.2.2",
  "pymupdf==1.28.0",
  "reportlab>=4.4,<5",
]
nli = [
  "onnxruntime==1.27.0",
  "tokenizers==0.23.1",
]
scientific-validation = [
  "great-expectations==1.19.1",
  "openml==0.15.1",
  "pyshacl>=0.30,<1",
  "roc-validator==0.11.3",
  "scikit-learn>=1.6,<2",
]

[project.scripts]
research-forge = "research_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["research_forge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
