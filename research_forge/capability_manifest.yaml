schema_version: 1
capabilities:
  - capability_id: workflow.control_loop
    title: 四阶段工作流控制闭环
    category: workflow
    claim: 四阶段 Study、持久步骤、负责人 Gate 与阶段交接已通过受控端到端验证。
    claim_boundary: 这只证明工作流控制能闭环，不证明任意研究课题都能完成科学实验。
    declared_maturity: 3
    evidence_level: 2
    scope: bounded
    supported_profiles: [project_to_paper, idea_to_paper]
    entrypoint: research_forge.workflow_scheduler
    inputs: [Project, Study, StepInstance, GateRecord]
    outputs: [persistent_step_state, phase_handoff, audit_events]
    validators: [dependency_order, immutable_history, gate_authority]
    positive_cases: [project_to_paper_controlled_handoff]
    negative_cases: [blocked_gate_does_not_advance]
    upstream_sources: [Nextflow, Snakemake, MLflow, AutoResearchClaw]
    evidence:
      design: [docs/workflow-v2.md]
      source: [research_forge/workflow_scheduler.py]
      component_validation: [tests/test_workflow_scheduler.py]
      controlled_e2e: [tests/test_web_app.py]

  - capability_id: research_contract.compiler
    title: 研究契约编译器
    category: scientific_execution
    claim: 编译器可在组件测试中阻止占位任务、同臂设计、泛化臂描述和部分未识别的金融协议。
    claim_boundary: 编译器尚未证明能把所有跨领域研究设计无缺口地编译为可执行实验。
    declared_maturity: 2
    evidence_level: 1
    scope: bounded
    supported_profiles: [tabular_ml_v1, benchmark_prediction_v1, existing_python_project_v1, computational_paired_comparison_v1, computational_paired_comparison_v2]
    entrypoint: research_forge.contract_compiler:compile_research_contract
    inputs: [ResearchContractVersion, approved_resources]
    outputs: [RunSpecification, EvaluationSpecification, AnalysisSpecification, BlockingIssueReport]
    validators: [placeholder_check, arm_distinction, metric_protocol, domain_policy]
    positive_cases: [capbench-openml-classification, deterministic_contract_fixture]
    negative_cases: [capbench-missing-label-builder, capbench-metric-name-no-formula, capbench-target-leakage, capbench-identical-arms]
    upstream_sources: [OpenML, MLPerf, Code Ocean]
    evidence:
      design: [docs/stage-2-feasibility-protocol-baseline.md]
      source: [research_forge/contract_compiler.py, research_forge/scientific_contribution_gate.py]
      component_validation: [tests/test_contract_compiler.py, tests/test_scientific_contribution_gate.py]

  - capability_id: scientific_execution.typed_profiles
    title: 类型化实验执行 Profile
    category: scientific_execution
    claim: 已实现 tabular_ml_v1、benchmark_prediction_v1、existing_python_project_v1，以及有限的一组配对、二元、聚类、多端点和多臂实验 Profile，并有组件级验证。
    claim_boundary: 三种通用 Profile 整体仍为 C2；tabular_ml_v1 的五个官方 OpenML 数值任务已达到窄范围 C3。两个非预制 Python 项目已经通过独立于源目录的密封包双重容器重放，但这只使窄范围 replay utility 达到 C4，尚未证明 existing_python_project_v1 完整 Stage 2 → Stage 3 双臂科学链达到 C4，也不是 C5 外部独立复现。tabular_ml_v1 正式范围仅为数值 CSV 的冻结 train/test split、二分类/回归和内置确定性 estimator；K-fold 目前只用于阶段二可行性。benchmark_prediction_v1 要求 submission 与隐藏 target 隔离；existing_python_project_v1 要求冻结容器、requirements lock、显式双臂命令与独立 evaluator。
    declared_maturity: 2
    evidence_level: 1
    scope: bounded
    supported_profiles: [tabular_ml_v1, benchmark_prediction_v1, existing_python_project_v1, computational_paired_comparison_v1, computational_paired_comparison_v2, paired_binary_independent_v1, paired_binary_clustered_v1, paired_multi_endpoint_v1, paired_multi_arm_ablation_v1]
    entrypoint: research_forge.stage_three
    inputs: [frozen_contract, profile_bundle, resource_bindings]
    outputs: [experiment_assets, run_matrix, evaluator_assets]
    validators: [profile_capability_match, resource_authority, trust_gate]
    positive_cases: [certified_paired_profile, deterministic_tabular_classification, deterministic_tabular_regression, isolated_benchmark_submission, frozen_existing_project_adapter]
    negative_cases: [unsupported_profile_is_blocked]
    upstream_sources: [OpenML, AIRS]
    evidence:
      design: [docs/stage-3-execution-kernel.md, docs/profile-capability-matrix.md]
      source: [research_forge/stage_three.py, research_forge/profiles/registry.py, research_forge/profiles/tabular_ml.py, research_forge/profiles/benchmark_prediction.py, research_forge/profiles/existing_python_project.py, research_forge/existing_project_replay.py, research_forge/profile_capability_matrix.yaml]
      component_validation: [tests/test_stage_three.py, tests/test_profiles.py, tests/test_tabular_ml_profile.py, tests/test_benchmark_prediction_profile.py, tests/test_existing_python_project_profile.py, tests/test_existing_project_replay.py, tests/test_profile_capability_matrix.py]

  - capability_id: reproduction.sealed_existing_project_replay
    title: 已有 Python 项目密封重放
    category: reproducibility
    claim: 两个非预制用户项目的显式源码切片已分别密封，并在两个全新的离线 Docker 工作区中重放；冻结历史指标与跨重放指标均一致。
    claim_boundary: 这是同一主机、同一 Research Forge 控制面的真实项目隔离重放，不是外部独立信任域 C5；它也不证明任意 Python 项目可自动适配或完整双臂科学实验链已达到 C4。
    declared_maturity: 4
    evidence_level: 3
    scope: limited_real_case
    supported_profiles: [explicit_python_unittest_replay, explicit_json_metric_replay]
    entrypoint: research_forge.existing_project_replay:replay_existing_project_package
    inputs: [owner_approved_file_allowlist, replay_spec, historical_metric_expectation]
    outputs: [sealed_package_manifest, isolation_attestation, deterministic_replay_report]
    validators: [path_confinement, secret_guard, file_hashes, offline_container, deterministic_metric_parser, historical_match, cross_replay_equality]
    positive_cases: [stock_disclosure_extractor_real_project, adviser_adapter_inventory_real_project]
    negative_cases: [path_escape_is_rejected, package_tampering_is_rejected]
    upstream_sources: [Code Ocean, ACM Artifact Review]
    evidence:
      design: [docs/existing-python-project-real-case-validation-2026-07-31.md]
      source: [research_forge/existing_project_replay.py, scripts/run_existing_project_replay.py]
      component_validation: [tests/test_existing_project_replay.py]
      controlled_e2e: [docs/existing-python-project-real-case-validation-2026-07-31.md]
      real_case: [docs/existing-python-project-real-case-validation-2026-07-31.md]

  - capability_id: scientific_completion.empirical_loop
    title: 实证科学完成闭环
    category: scientific_authority
    claim: 对已支持的类型化 Profile，实验资产、执行、评估和 Verdict 链已完成组件验证；不同评估器家族的逐项、聚合、方向与 Verdict 分歧可被显式记录。
    claim_boundary: 当前只达到部分实现；不能宣称一般性的真实项目科学闭环已经完成。
    declared_maturity: 2
    evidence_level: 1
    scope: bounded
    supported_profiles: [registered_typed_profiles]
    entrypoint: research_forge.stage_three
    inputs: [frozen_executable_contract, authorized_resources]
    outputs: [ResearchRun, HypothesisVerdict, Stage3CompletionPackage, EvaluatorDisagreementReport]
    validators: [execution_integrity, evidence_binding, verdict_authority, evaluator_family_disagreement]
    positive_cases: [typed_profile_completion_fixture]
    negative_cases: [build_failure_is_not_scientific_verdict]
    upstream_sources: [AIRS, CodeScientist]
    evidence:
      design: [docs/stage-3-completion-audit.md]
      source: [research_forge/stage_three.py, research_forge/stage_three_evaluator.py, research_forge/evaluator_comparison.py]
      component_validation: [tests/test_stage3_completion_authority.py, tests/test_stage_three_evaluator.py, tests/test_evaluator_comparison.py]

  - capability_id: scientific_completion.cross_domain_autonomy
    title: 跨领域自主科研闭环
    category: scientific_authority
    claim: 平台已实现跨领域执行扩展点和显式阻断语义。
    claim_boundary: 尚未达到跨领域自主完成真实科学研究；未知实验类型必须阻断而非伪装成功。
    declared_maturity: 1
    evidence_level: 0
    scope: extension_only
    supported_profiles: []
    entrypoint: research_forge.profiles.registry
    inputs: [research_design]
    outputs: [supported, supported_with_build, unsupported]
    validators: [explicit_unsupported_state]
    positive_cases: [registered_profile_routes]
    negative_cases: [unknown_profile_is_explicitly_unsupported]
    upstream_sources: [AIRA Dojo, AI Scientist]
    evidence:
      design: [docs/experiment-profile-bundles.md]
      source: [research_forge/profiles/registry.py]

  - capability_id: retrieval.gateway
    title: 外部检索网关
    category: retrieval
    claim: 离线默认、负责人授权、查询净化、预算、幂等和冻结响应已通过受控端到端测试。
    claim_boundary: Provider 可用性仍取决于部署验收、凭证、网络与具体数据权利。
    declared_maturity: 3
    evidence_level: 2
    scope: bounded
    supported_profiles: [academic_search, github, huggingface, public_web, open_access, openml_exact_dataset]
    entrypoint: research_forge.retrieval
    inputs: [RetrievalRequest, ProjectPolicy, StepInstance]
    outputs: [frozen_raw_response, normalized_resources, audit_events]
    validators: [policy, sanitization, idempotency, secret_guard]
    positive_cases: [approved_sanitized_retrieval]
    negative_cases: [offline_policy_blocks_external_call, secret_is_never_uploaded]
    upstream_sources: [PaperQA2, Unpaywall, GitHub, Hugging Face]
    evidence:
      design: [docs/retrieval-gateway-architecture.md]
      source: [research_forge/retrieval/interfaces/service.py, research_forge/retrieval/providers/openml.py]
      component_validation: [tests/test_retrieval_gateway.py, tests/test_openml_retrieval.py]
      controlled_e2e: [tests/test_external_research_v1.py]

