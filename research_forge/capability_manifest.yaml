    validators: [snapshot_hash, citation_membership, abstention]
    positive_cases: [paperqa_real_runtime_revalidation]
    negative_cases: [out_of_bundle_citation_is_rejected]
    upstream_sources: [PaperQA2]
    evidence:
      design: [docs/paperqa-integration.md]
      source: [research_forge/retrieval/evidence/paperqa_service.py]
      component_validation: [tests/test_paperqa_synthesis_v2.py]
      controlled_e2e: [tests/test_paperqa_comparison.py]
      real_case: [docs/paperqa-runtime-revalidation-2026-07-31.md]

